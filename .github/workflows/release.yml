name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS release assets
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: bash scripts/build-macos-dmg.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*-mac.zip
            release/*-mac.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    name: Build Windows release assets
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        shell: pwsh
        run: |
          npm run build:web
          if (!(Test-Path "dist-web\index.html")) {
            throw "dist-web\index.html was not generated."
          }

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller

      - name: Build Python backend
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name backend `
            --onedir `
            --noconsole `
            --clean `
            --add-data "character_runtime;character_runtime" `
            --add-data "characters;characters" `
            --add-data "dist-web;dist-web" `
            --add-data ".env.example;." `
            web_server.py
          if (!(Test-Path "dist\backend\backend.exe")) {
            throw "dist\backend\backend.exe was not generated."
          }

      - name: Build Windows release assets
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --win nsis portable --publish never
          $Version = node -p "require('./package.json').version"
          $Setup = Get-ChildItem "release" -Filter "*Setup*.exe" -File | Select-Object -First 1
          $Portable = Get-ChildItem "release" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1
          if (-not $Setup) {
            throw "Windows setup installer was not generated in release\."
          }
          if (-not $Portable) {
            throw "Windows portable package was not generated in release\."
          }
          $SetupTarget = "AI-Character-Platform-Setup-$Version.exe"
          $PortableTarget = "AI-Character-Platform-Portable-$Version.exe"
          if ($Setup.Name -ne $SetupTarget) {
            Rename-Item $Setup.FullName $SetupTarget
          }
          if ($Portable.Name -ne $PortableTarget) {
            Rename-Item $Portable.FullName $PortableTarget
          }
          $SetupBlockmap = Join-Path "release" "$($Setup.BaseName).exe.blockmap"
          if (Test-Path $SetupBlockmap) {
            Rename-Item $SetupBlockmap "$SetupTarget.blockmap"
          }
          $LatestYml = Join-Path "release" "latest.yml"
          if (Test-Path $LatestYml) {
            $content = Get-Content $LatestYml -Raw
            $content = $content -replace '(?m)^path: .+$', "path: $SetupTarget"
            $content = $content -replace '(?m)^(\s*- url: ).+$', "`$1$SetupTarget"
            Set-Content $LatestYml $content -NoNewline
          }
          Get-ChildItem release -Recurse

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-tauri-macos:
    name: Build Tauri macOS release assets
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri macOS release
        run: npm run tauri:release:macos -- --ci --no-sign

      - name: Upload Tauri macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-release
          path: |
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*
          if-no-files-found: error

  build-tauri-windows:
    name: Build Tauri Windows release assets
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows release
        shell: pwsh
        run: npm run tauri:release:windows -- --ci --no-sign

      - name: Upload Tauri Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
          if-no-files-found: error

  build-tauri-android:
    name: Build Tauri Android release assets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust Android targets
        shell: bash
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Initialize Tauri Android project
        run: npm run tauri:android:init -- --ci --skip-targets-install

      - name: Build Tauri Android release
        run: npm run tauri:release:android -- --ci

      - name: Upload Tauri Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-release
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-tauri-macos
      - build-tauri-windows
      - build-tauri-android
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Detect prerelease
        id: release-type
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          generate_release_notes: true
