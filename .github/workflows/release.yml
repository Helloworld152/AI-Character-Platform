name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: bash scripts/build-macos-dmg.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        shell: pwsh
        run: |
          npm run build:web
          if (!(Test-Path "dist-web\index.html")) {
            throw "dist-web\index.html was not generated."
          }

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller

      - name: Build Python backend
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name backend `
            --onedir `
            --noconsole `
            --clean `
            --add-data "character_runtime;character_runtime" `
            --add-data "characters;characters" `
            --add-data "dist-web;dist-web" `
            --add-data ".env.example;." `
            web_server.py
          if (!(Test-Path "dist\backend\backend.exe")) {
            throw "dist\backend\backend.exe was not generated."
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --win nsis
          Get-ChildItem release -Recurse

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
